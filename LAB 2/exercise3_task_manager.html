<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>
    <style>
        body { font-family: Arial; }
        .board { display: flex; gap: 20px; }
        .column {
            width: 30%;
            padding: 10px;
            border: 2px solid #000;
            min-height: 200px;
        }
        .task {
            background: lightgray;
            padding: 8px;
            margin: 5px 0;
            cursor: grab;
        }
        .completed {
            background: lightgreen;
        }
    </style>
</head>
<body>

<h2>Task Manager</h2>
<input type="text" id="taskInput" placeholder="Enter task">
<button onclick="addTask()">Add Task</button>

<div class="board">
    <div class="column" ondrop="drop(event)" ondragover="allowDrop(event)">
        <h3>To Do</h3>
    </div>

    <div class="column" ondrop="drop(event)" ondragover="allowDrop(event)">
        <h3>In Progress</h3>
    </div>

    <div class="column" ondrop="drop(event)" ondragover="allowDrop(event)">
        <h3>Completed</h3>
    </div>
</div>

<script>
    function allowDrop(ev) {
        ev.preventDefault();
    }

    function drag(ev) {
        ev.dataTransfer.setData("text", ev.target.id);
    }

    function drop(ev) {
        ev.preventDefault();
        const data = ev.dataTransfer.getData("text");
        const task = document.getElementById(data);
        ev.target.appendChild(task);

        if (ev.target.querySelector("h3").innerText === "Completed") {
            task.classList.add("completed");
            alert("Task Completed Successfully");
        }
    }

    let count = 0;
    function addTask() {
        const input = document.getElementById("taskInput").value;
        if (input === "") return;

        const task = document.createElement("div");
        task.className = "task";
        task.id = "task" + count++;
        task.draggable = true;
        task.ondragstart = drag;
        task.innerText = input + " (" + new Date().toLocaleDateString() + ")";

        document.querySelector(".column").appendChild(task);
        document.getElementById("taskInput").value = "";
    }
</script>

</body>
</html>
